# Cheasee-Pi — Docker Compose orchestration
# ===========================================
# Lives in the CLI-managed cache dir (~/.cache/cheasee-pi/<cli-version>/),
# extracted by `cheasee-pi start`. The build context is the cache dir itself
# (`context: .`); the user's repo is bind-mounted at /workspaces/main via
# WORKSPACE_HOST_PATH — a CLI-resolved absolute toplevel, never ${PWD}
# (shells keep a logical PWD on macOS; getcwd resolves it).
#
# Usage (via wrapper — injects a per-repo compose project name):
#   cheasee-pi start
#
# Direct usage (compose resolves relative paths against this file's dir; the
# `name: cheasee-pi` below is a fallback only — the CLI always passes a
# per-repo COMPOSE_PROJECT_NAME, so raw usage must pass -p too):
#   docker compose -p cheasee-pi-<repo-slug> \
#     -f <cacheDir>/docker-compose.yml up -d --build
#   docker exec -it cheasee-pi-<repo-slug> /bin/bash -c 'cd /workspaces/main && pi'

name: cheasee-pi

services:
  cheasee-pi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PI_VERSION: ${PI_VERSION:-latest}
        CHEASEE_REF: ${CHEASEE_REF:-main}
    container_name: ${CHEASEEPI_CONTAINER:-cheasee-pi}
    labels:
      - com.cheaseepi.managed=true
    environment:
      - HOST_UID=${HOST_UID:-}
      - HOST_GID=${HOST_GID:-}
      - HOST_GIT_NAME=${HOST_GIT_NAME:-Cheasee-Pi}
      - HOST_GIT_EMAIL=${HOST_GIT_EMAIL:-cheasee-pi@localhost}
      # pi.dev's update check nags inside the container: "Run pi update"
      # is misleading there (npm-global updates are wiped on rebuild), and
      # the image's pi version is owned by the PI_VERSION build arg + stamp,
      # not by pi.dev's latest-version API. Skip the check entirely.
      - PI_SKIP_VERSION_CHECK=1
    volumes:
      - ${WORKSPACE_HOST_PATH}:/workspaces/main${VOLUME_RELABEL:-}
      - ${WORKSPACE_BARE_PATH}:/workspaces/.bare${VOLUME_RELABEL:-}
      - ~/.config/gh:/home/agentuser/.config/gh:rw${VOLUME_RELABEL:-}
      - ~/.config/cheasee-pi:/home/agentuser/.config/cheasee-pi:rw${VOLUME_RELABEL:-}
    mem_limit: ${CHEASEEPI_MEMORY:-5G}
    cpus: ${CHEASEEPI_CPUS:-4.0}
    init: true
    stdin_open: true
    tty: true
    shm_size: 64m
    ulimits:
      nofile: 1048576
    command: ["sleep", "infinity"]
    healthcheck:
      # Ready marker: entrypoint.sh touches /tmp/.cheasee-pi-ready only after
      # first-run setup (worktree fix, ownership, workspace npm install)
      # completes — pi --version would pass while deps are still installing,
      # letting `cheasee-pi start` race the entrypoint.
      test: ["CMD-SHELL", "test -f /tmp/.cheasee-pi-ready"]
      interval: 10s
      retries: 3
      start_period: 15s

  codeflow:
    # Browser-based code-structure visualizer (tree-sitter AST, 18 languages),
    # served locally and pointed at this workspace. Settings live in
    # codeflow/config.json relative to this compose file (bind-mounted,
    # editable without rebuild).
    #
    #   http://localhost:8470/?repo=local/workspace&run=1
    #
    # Port mapping: host side via CODEFLOW_PORT — `cheasee-pi start` derives a
    # per-repo port (8470 + repo-slug hash, 8470–9469) so parallel containers
    # don't collide on the fixed default; an explicit CODEFLOW_PORT env var
    # overrides. Container side from the "port" key in config.json (default
    # 8470) — keep them in sync when changing either.
    build:
      context: codeflow
    container_name: ${CODEFLOW_CONTAINER:-codeflow}
    labels:
      - com.cheaseepi.managed=true
    environment:
      - REPO_ROOT=/workspaces/main
    volumes:
      - ${WORKSPACE_HOST_PATH}:/workspaces/main:ro${VOLUME_RELABEL:-}
      - ./codeflow/config.json:/opt/codeflow/config.json:ro
    ports:
      - "${CODEFLOW_PORT:-8470}:8470"
