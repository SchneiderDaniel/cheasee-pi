# Cheasee-Pi — Docker Compose orchestration
# ===========================================
# Lives in the CLI-managed cache dir (~/.cache/cheasee-pi/<cli-version>/),
# extracted by `cheasee-pi start`. The build context is the cache dir itself
# (`context: .`); the user's repo is bind-mounted at /workspaces/main via
# WORKSPACE_HOST_PATH — a CLI-resolved absolute toplevel, never ${PWD}
# (shells keep a logical PWD on macOS; getcwd resolves it).
#
# Usage (via wrapper — injects a per-repo compose project name):
#   cheasee-pi start
#
# Direct usage (compose resolves relative paths against this file's dir; the
# `name: cheasee-pi` below is a fallback only — the CLI always passes a
# per-repo COMPOSE_PROJECT_NAME, so raw usage must pass -p too):
#   docker compose -p cheasee-pi-<repo-slug> \
#     -f <cacheDir>/docker-compose.yml up -d --build
#   docker exec -it cheasee-pi-<repo-slug> /bin/bash -c 'cd /workspaces/main && pi'

name: cheasee-pi

# Credential secret (issue #2076). NOTHING else from the host config dir is
# mounted: a `file:` secret is the only source that yields a READ-ONLY bind
# mount outside Swarm (`content:`/`environment:` tar the value into the
# container's writable layer; `external:`/`driver:` are hard errors). Compose
# resolves `~` and expands it exactly like a bind source, so the CLI passes an
# absolute CHEASEEPI_AUTH_FILE and direct usage still works. Secret content is
# stripped when Compose marshals its model, so `docker compose config` can only
# ever print this path — never a credential value.
#
# The host file stays the single source of truth: `cheasee-pi auth` is the only
# writer, and the mounted file is pinned to the inode resolved at container
# creation, so a credential change requires a container recreate
# (`cheasee-pi start --build`) for the file-backed readers (ui child env, the
# gh tmpfs seed, the supervisor's file fallback). Exec-time GH_TOKEN and
# provider keys stay live.
secrets:
  cheasee_auth:
    file: ${CHEASEEPI_AUTH_FILE:-~/.config/cheasee-pi/auth.json}

services:
  cheasee-pi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pinned released version (matches the Dockerfile ARG default).
        # `PI_VERSION=latest` is the explicit opt-in override.
        PI_VERSION: ${PI_VERSION:-1.0.2}
        CHEASEE_REF: ${CHEASEE_REF:-main}
        # Content-addressed cache-bust for the baked /opt/cheasee-pi clone
        # (Dockerfile Layer 6b): the CLI resolves CHEASEE_REF's upstream
        # commit and passes it here, so the clone re-runs exactly when
        # upstream moves and stays cached when it does not. Scoped to THIS
        # service only — the ui/codeflow images bake no clone.
        CHEASEE_COMMIT: ${CHEASEE_COMMIT:-}
        # Cache-busting stamp owned by the CLI (applyComposeEnv) and declared
        # on THIS service only: the agent's pi layer must re-resolve the
        # requested version on every build, while the ui sidecar tracks
        # PI_VERSION via its own cache key. A global `--build-arg` would
        # silently reach the ui service too.
        PI_BUILD_STAMP: ${PI_BUILD_STAMP:-}
    container_name: ${CHEASEEPI_CONTAINER:-cheasee-pi}
    labels:
      - com.cheaseepi.managed=true
      # CLI-owned credential stamp (sha256 over the host auth.json's identity:
      # inode, size, mtime_ns — never its content). The drift check on the
      # running&&!build path compares it against a freshly computed value and
      # warns with the recovery command.
      - com.cheaseepi.auth-spec=${CHEASEEPI_AUTH_SPEC:-}
    environment:
      - HOST_UID=${HOST_UID:-}
      - HOST_GID=${HOST_GID:-}
      - HOST_GIT_NAME=${HOST_GIT_NAME:-Cheasee-Pi}
      - HOST_GIT_EMAIL=${HOST_GIT_EMAIL:-cheasee-pi@localhost}
      # The credential arrives as ONE read-only file (the cheasee_auth secret),
      # never as a directory and never as a value. Same override name the ui
      # sidecar already honours (ui/src/auth.rs load_child_env).
      - CHEASEE_AUTH_PATH=/run/secrets/cheasee_auth
      # gh still needs a WRITABLE config dir for hosts.yml: point it at the
      # container-local tmpfs below and the entrypoint seeds it from the
      # read-only secret. No host write path exists.
      - GH_CONFIG_DIR=/home/agentuser/.config/gh
      # pi.dev's update check nags inside the container: "Run pi update"
      # is misleading there (npm-global updates are wiped on rebuild), and
      # the image's pi version is owned by the PI_VERSION build arg + stamp,
      # not by pi.dev's latest-version API. Skip the check entirely.
      - PI_SKIP_VERSION_CHECK=1
    volumes:
      - ${WORKSPACE_HOST_PATH}:/workspaces/main${VOLUME_RELABEL:-}
      - ${WORKSPACE_BARE_PATH}:/workspaces/.bare${VOLUME_RELABEL:-}
    tmpfs:
      # Memory-only, root-owned at creation (entrypoint hands it to agentuser
      # and seeds hosts.yml): a container-local gh config with no host write
      # path, gone on every container removal.
      - /home/agentuser/.config/gh:mode=0700
    secrets:
      - cheasee_auth
    mem_limit: ${CHEASEEPI_MEMORY:-5G}
    cpus: ${CHEASEEPI_CPUS:-4.0}
    init: true
    stdin_open: true
    tty: true
    shm_size: 64m
    ulimits:
      nofile: 1048576
    command: ["sleep", "infinity"]
    healthcheck:
      # Ready marker: entrypoint.sh touches /tmp/.cheasee-pi-ready only after
      # first-run setup (worktree fix, ownership, workspace npm install)
      # completes — pi --version would pass while deps are still installing,
      # letting `cheasee-pi start` race the entrypoint.
      test: ["CMD-SHELL", "test -f /tmp/.cheasee-pi-ready"]
      interval: 10s
      retries: 3
      start_period: 15s

  codeflow:
    # Browser-based code-structure visualizer (tree-sitter AST, 18 languages),
    # served locally and pointed at this workspace. Settings live in
    # codeflow/config.json relative to this compose file (bind-mounted,
    # editable without rebuild).
    #
    #   http://localhost:8470/?repo=local/workspace&run=1
    #
    # Port mapping: host side via CODEFLOW_PORT — `cheasee-pi start` derives a
    # per-repo port (8470 + repo-slug hash, 8470–9493) so parallel containers
    # don't collide on the fixed default; an explicit CODEFLOW_PORT env var
    # overrides. Host-side bind is pinned to loopback (CODEFLOW_HOST_IP,
    # default 127.0.0.1): the sidecar serves the workspace source read-only
    # and the printed URL is http://localhost:<port>/..., so it must not be
    # routable off-host. 0.0.0.0 is an explicit, documented opt-in for remote
    # access only. Container side from the "port" key in config.json (default
    # 8470) — keep them in sync when changing either.
    build:
      context: codeflow
    container_name: ${CODEFLOW_CONTAINER:-codeflow}
    labels:
      - com.cheaseepi.managed=true
      # CLI-owned spec stamp (sha256 over CLI version + cache-dir path +
      # explicit port + extracted config.json/compose bytes) — the drift
      # check on the running&&!build path compares this against a freshly
      # computed value. Owned by the CLI, not Compose's internal
      # config-hash (unstable across Compose versions).
      - com.cheaseepi.codeflow-spec=${CHEASEEPI_CODEFLOW_SPEC:-}
    environment:
      - REPO_ROOT=/workspaces/main
    volumes:
      - ${WORKSPACE_HOST_PATH}:/workspaces/main:ro${VOLUME_RELABEL:-}
      # The workspace is a linked worktree: its .git pointer
      # (`gitdir: ../.bare/worktrees/main`) only resolves when the sibling
      # bare repo is mounted too. Without it the shim's `git check-ignore`
      # filter fails open and CodeFlow analyzes gitignored installs
      # (virtualenvs, .pi/git). Mirrors the cheasee-pi service above.
      - ${WORKSPACE_BARE_PATH}:/workspaces/.bare:ro${VOLUME_RELABEL:-}
      - ./codeflow/config.json:/opt/codeflow/config.json:ro
    ports:
      - "${CODEFLOW_HOST_IP:-127.0.0.1}:${CODEFLOW_PORT:-8470}:8470"

  ui:
    # Cheasee-Pi web control center: the Leptos hydrate shell served by Axum
    # (GET /, /assets/*, /ws, /health). Host side via PI_UI_PORT — `cheasee-pi start` derives a
    # per-repo port (9500 + repo-slug hash, 9500–10523) so parallel containers
    # don't collide on the fixed default; an explicit PI_UI_PORT or
    # docker.uiPort overrides. Host-side bind is hard-pinned to 127.0.0.1 (no
    # CODEFLOW_HOST_IP-style opt-in): loopback-only is a hard invariant for
    # the control center, never routable off-host. Container side is fixed at
    # 3000 — ui/src/main.rs binds all container interfaces there (required for
    # the published DNAT port to reach it); keep them in sync when changing
    # either.
    build:
      context: ui
      dockerfile: Dockerfile
      args:
        PI_VERSION: ${PI_VERSION:-1.0.2}
    container_name: ${PI_UI_CONTAINER:-ui}
    labels:
      - com.cheaseepi.managed=true
      # Same CLI-owned credential stamp as the agent: a stale sidecar reads a
      # stale auth.json for its spawned pi RPC children.
      - com.cheaseepi.auth-spec=${CHEASEEPI_AUTH_SPEC:-}
    environment:
      - CHEASEE_AUTH_PATH=/run/secrets/cheasee_auth
      # Peer-instance discovery snapshot (read-only, CLI-written): the sidecar
      # renders the instances other workspaces registered. Labels and ports
      # only — the file never carries a host path, and `ui` still has no host or
      # docker access of its own.
      - CHEASEEPI_INSTANCES=/run/cheaseepi/instances.json
    restart: unless-stopped
    # Run as the host uid/gid: the credential secret is a bind mount of the
    # host's 0600 auth.json, and Compose ignores uid/gid/mode outside Swarm, so
    # the host file's ownership carries through unchanged (AC1). HOST_UID/GID
    # are the same seam the agent service uses; unset defaults to 1000.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ${WORKSPACE_HOST_PATH}:/workspaces/main${VOLUME_RELABEL:-}
      # Host-wide discovery snapshot, written by the CLI on every start/stop.
      # NOT workspace-scoped and NOT the docker socket: peer discovery is a
      # read-only label view the CLI already owns (docs/security.md). The CLI
      # always sets the env var; the /dev/null default keeps direct
      # `docker compose up` runs valid (the sidecar then lists no peers).
      - ${CHEASEEPI_INSTANCE_SNAPSHOT:-/dev/null}:/run/cheaseepi/instances.json:ro
    secrets:
      # Read-only by construction, and the server is network-reachable. No gh
      # config mount: the ui reads provider keys only (no `.config/gh`,
      # `hosts.yml` or "gh" reference under ui/src).
      - cheasee_auth
    ports:
      - "127.0.0.1:${PI_UI_PORT:-9500}:3000"
    healthcheck:
      # The server's /health endpoint is the liveness signal (the entrypoint
      # marker belongs to the agent container, not this sidecar). Probed over
      # container-loopback, matching the host-side port pin — the compose scan
      # in TestCompose_UILoopbackOnly rejects the all-interfaces literal here.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      retries: 3
      start_period: 10s
