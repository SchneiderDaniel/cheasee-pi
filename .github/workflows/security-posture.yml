# Security Posture
# ================
# Probes the GitHub-native security features (Dependabot, code scanning,
# secret scanning, malware scanning) via the REST API and fails when a
# feature is disabled or has open alerts (issue #1470).
#   - pull_request (unfiltered): enforcement — open alerts block merge
#   - push to main: merge-time enforcement
#   - schedule nightly: alert counts drift over time
#   - workflow_dispatch: manual re-run (fork-PR 403 recovery path)
#
# Contract test runs first (network-free, stubbed gh), then the real
# check. Exit codes from scripts/check-security-posture.sh:
#   0 = PASS (all enabled, zero open alerts), 1 = FAIL (posture
#   violation), 2 = ERROR (check infrastructure failure).
#
# Budget: <1 min

name: Security posture

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

concurrency:
  group: "security-posture"
  cancel-in-progress: true

jobs:
  posture:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Contract test (stubbed gh, no network)
        run: bash test/security-posture.test.sh

      - name: Check security posture
        run: bash scripts/check-security-posture.sh
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.CHEASEE_PI_SECURITY_TOKEN || github.token }}
