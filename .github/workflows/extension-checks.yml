# Extension Checks
# =================
# Validates that all pi extensions load without errors on every PR.
# Runs the cross-extension smoke test suite:
#   - Directory structure validation
#   - pi startup with extension loading (catches duplicate identifiers, import errors, etc.)
#   - Cross-extension conflict detection (duplicate tools, commands, flags)
#   - Extension manifest validation
#   - Cross-extension import rules
#
# Budget: ~2 min

name: Extension Checks

on:
  pull_request:
    paths:
      - ".pi/extensions/**"
      - ".pi/settings.json"
      - "test/extensions-load.test.mts"
      - "package.json"
      - "package-lock.json"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check extensions
        run: npx tsc --noEmit --project .pi/tsconfig.json

      - name: Run supervisor split-contract tests
        run: |
          node --experimental-strip-types --test \
            .pi/extensions/supervisor/test/pipeline/stages-split.test.mts \
            .pi/extensions/supervisor/test/pipeline/stages.test.mts \
            .pi/extensions/supervisor/test/pipeline/handler-entry.test.mts \
            .pi/extensions/supervisor/test/pipeline/handler-shared.test.mts \
            .pi/extensions/supervisor/test/pipeline/handler-structure.test.mts \
            .pi/extensions/supervisor/test/gate-failure-context.test.mts

      - name: Run extension load tests
        run: |
          PI_BIN=./node_modules/.bin/pi \
            node --experimental-strip-types --test test/extensions-load.test.mts
