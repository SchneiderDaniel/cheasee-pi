# Shell Lint + Uninstall Script Tests
# ===================================
# Shellcheck on the scripts/ directory (issue #1510: previously no shell was
# linted) and the standalone uninstall-script adapter tests. Fast (~1 min).
#
# Budget: ~1 min

name: Shell Lint

on:
  pull_request:
    paths:
      - "scripts/**"
      - "test/uninstall-script.test.sh"
      - ".github/workflows/shell-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck scripts
        run: shellcheck scripts/install.sh scripts/uninstall.sh

      - name: Run uninstall script adapter tests
        run: bash test/uninstall-script.test.sh
