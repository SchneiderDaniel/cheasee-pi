# Embed Sync Check
# =================
# The canonical docker tree lives at cmd/cheasee-pi/embedded/docker/
# (real files there are required by //go:embed embedded in embed.go).
# The repo-root docker/ tree is a generated build artifact for the
# dev-facing compose workflow. This workflow regenerates it and verifies
# the docker-tree/check-docker Makefile targets keep the trees in sync,
# and that no generated file is tracked (single canonical tree, no drift).
#
# Budget: <1 min

name: Embed Sync Check

on:
  pull_request:
    paths:
      - "cmd/cheasee-pi/embedded/docker/**"
      - "Makefile"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Regenerate docker/ tree from embedded source
        run: make docker-tree

      - name: Verify docker/ mirrors embedded source
        run: make check-docker

      - name: Assert generated files are not tracked
        run: |
          tracked="$(git ls-files docker/ | grep -Ev '^(docker/docker-compose\.legacy\.yml|docker/test/.*)$' || true)"
          if [ -n "$tracked" ]; then
            echo "Generated docker/ files must not be tracked (canonical source is cmd/cheasee-pi/embedded/docker/):"
            echo "$tracked"
            exit 1
          fi
