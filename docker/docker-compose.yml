# Cheasee-Pi — Docker Compose orchestration
# ===========================================
# Builds and runs the cheasee-pi container with workspace mounts,
# environment variables, and resource limits driven by .pi/settings.json.
#
# Usage (via wrapper):
#   ./cheasee-pi.sh
#
# Direct usage (without wrapper — uses defaults):
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker exec -it cheasee-pi /bin/bash -c 'cd /workspaces/main && pi'

services:
  cheasee-pi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PI_VERSION: ${PI_VERSION:-latest}
    container_name: cheasee-pi
    environment:
      - HOST_UID=${HOST_UID:-}
      - HOST_GID=${HOST_GID:-}
      - HOST_GIT_NAME=${HOST_GIT_NAME:-Cheasee-Pi}
      - HOST_GIT_EMAIL=${HOST_GIT_EMAIL:-cheasee-pi@localhost}
    volumes:
      - ../../:/workspaces
      - ~/.config/gh:/home/agentuser/.config/gh:rw
    mem_limit: ${CHEASEEPI_MEMORY:-2G}
    cpus: ${CHEASEEPI_CPUS:-4.0}
    init: true
    stdin_open: true
    tty: true
    shm_size: 1g
    ulimits:
      nofile: 1048576
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "pi", "--version"]
      interval: 10s
      retries: 3
      start_period: 15s
