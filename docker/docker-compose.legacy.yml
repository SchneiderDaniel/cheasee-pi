# Cheasee-Pi legacy compose override
# ====================================
# Override the container name so cheasee-pi.sh runs independently
# from the default "cheasee-pi" name.
#
# Used by: cheasee-pi.sh
# Usage:   docker compose -f docker/docker-compose.legacy.yml up -d
# (with the CLI's extracted compose file; see cache dir from `cheasee-pi`)

services:
  cheasee-pi:
    container_name: cheasee-pi-v1
