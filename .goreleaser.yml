version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/cheasee-pi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: SchneiderDaniel
    repo: cheasee-pi
